name: cd

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'docker_run.sh'
      - 'scripts/seed.py'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ccc115a/nqu_erp

jobs:
  build-push:
    name: 建置並推送 API / Web 映像（GHCR）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 建置 + 推送 api（${{ github.sha }} / main）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 建置 + 推送 web（${{ github.sha }} / main）
        uses: docker/build-push-action@v5
        with:
          # note：build-push-action 的 file 相對 context；context=./frontend → file=Dockerfile
          context: ./frontend
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 列出推送結果
        run: |
          echo "已推送："
          echo "  ghcr.io/${{ env.IMAGE_NAME }}-api:main"
          echo "  ghcr.io/${{ env.IMAGE_NAME }}-web:main"
