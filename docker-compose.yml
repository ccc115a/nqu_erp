# NQU-ERP v0.4 Docker 部署：db（PostgreSQL）+ api（Rust）+ web（nginx 同源代理）
# 使用方式：
#   docker compose up -d --build        # 啟動 db/api/web
#   docker compose --profile seed run --rm seed    # （DB 就緒後）喂入假資料，僅需執行一次
services:
  db:
    image: postgres:16-alpine
    # 開發/示範用密碼；正式環境請改用 secret 管理，勿直接寫死在 compose
    environment:
      POSTGRES_USER: nqu
      POSTGRES_PASSWORD: nqu
      POSTGRES_DB: nqu
    volumes:
      # 資料持久化：container 重建不會丟失資料
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nqu -d nqu"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgres://nqu:nqu@db:5432/nqu
      # 可用環境變數覆寫；缺省值不適合正式環境
      JWT_SECRET: ${JWT_SECRET:-nqu-erp-secret-key-change-in-production}
      SERVER_ADDR: 0.0.0.0:8080
      # 同源部署由 nginx 代理，瀏覽器不會直接跨來源打後端；放行全部簡化設定
      CORS_ORIGIN: '*'
    depends_on:
      db:
        condition: service_healthy
    # api 不直接對外暴露：瀏覽器一律走 web (nginx) 的 /api 反向代理；
    # 本機開發用的 8080 留給 local dev server，避免與測試腳本衝突。
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # 前端以同源 /api/v1 打後端，由 nginx 代理
        VITE_API_BASE: /api/v1
    ports:
      # 對外 port 可用 WEB_PORT 指定（docker_run.sh [port]）；預設 80
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 一次性 seed 服務：非正式啟動，使用 docker compose --profile seed run --rm seed 執行。
  # 掛上 profile 讓預設的 docker compose up 不會自動啟動它（避免在 migration 完成前執行）。
  seed:
    image: postgres:16-alpine
    profiles: ["seed"]
    command: ["psql", "postgres://nqu:nqu@db:5432/nqu", "-v", "ON_ERROR_STOP=1", "-f", "/scripts/seed.sql"]
    volumes:
      # 將 scripts 掛載進去，psql 才能讀到 seed.sql
      - ./scripts:/scripts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: